name: Debian Sid Auto-Build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '.github/workflows/**'
  schedule:
    - cron: '37 20 * * *' # Avoid peak hours, runs around 04:37 AM Taipei Time
  workflow_dispatch:
    inputs:
      build_static:
        description: 'Build statically linked package'
        required: false
        type: boolean
        default: false

env:
  FORCE_BUILD: "false"
  BUILD_STATIC: "false"

jobs:
  check-triggers:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.decision.outputs.needs_build }}
      latest_tag: ${{ steps.check.outputs.tag }}
      pkg_timestamp: ${{ steps.decision.outputs.pkg_timestamp }}
      build_static: ${{ steps.decision.outputs.build_static }}
    steps:
      - name: Fetch Upstream Tag and Dependencies
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Fetch Latest Upstream Tag for partclone (Ignoring text tags like 'stable')
          LATEST_TAG=$(gh api repos/Thomas-Tsai/partclone/tags --jq 'map(select(.name | test("^v?[0-9]"))) | .[0].name')
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # 2. Fetch Latest Sid Versions for partclone core dependencies
          # [!] Replace these packages with partclone's actual Build-Depends (e.g., uuid-dev, libblkid-dev, etc.)
          BASE_URL="https://api.ftp-master.debian.org/madison"
          DEP1_VER=$(curl -s "${BASE_URL}?package=uuid-dev&s=sid&text=on" | awk '{print $3}' | head -n 1)
          DEP2_VER=$(curl -s "${BASE_URL}?package=libblkid-dev&s=sid&text=on" | awk '{print $3}' | head -n 1)
          
          # 3. Create Combined Fingerprint
          FINGERPRINT="sid-tag${LATEST_TAG}-dep1${DEP1_VER}-dep2${DEP2_VER}"
          echo "Combined Fingerprint: $FINGERPRINT"
          echo "fingerprint=$FINGERPRINT" >> $GITHUB_OUTPUT

      - name: Check Build Cache
        id: cache-check
        uses: actions/cache@v4
        with:
          path: last-build-fingerprint.txt
          key: build-cache-sid-${{ steps.check.outputs.fingerprint }}

      - name: Decide to Build
        id: decision
        run: |
          BUILD_STATIC="${{ env.BUILD_STATIC }}"
          if [ -z "$BUILD_STATIC" ]; then
            BUILD_STATIC="false"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.build_static }}" ]]; then
            BUILD_STATIC="${{ inputs.build_static }}"
          fi
          echo "build_static=$BUILD_STATIC" >> $GITHUB_OUTPUT

          echo "=== Evaluating Trigger Criteria ==="
          echo "Event Name:   ${{ github.event_name }}"
          echo "Force Build:  ${{ env.FORCE_BUILD }}"
          echo "Build Static: $BUILD_STATIC"
          echo "Cache Hit:    ${{ steps.cache-check.outputs.cache-hit }}"
          echo "Fingerprint:  ${{ steps.check.outputs.fingerprint }}"
          echo "===================================="

          reasons=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            reasons+=("Manual workflow dispatch trigger")
          fi
          if [[ "${{ env.FORCE_BUILD }}" == "true" ]]; then
            reasons+=("FORCE_BUILD is enabled (true)")
          fi
          if [[ "${{ steps.cache-check.outputs.cache-hit }}" != "true" ]]; then
            reasons+=("Cache miss (new upstream tag or updated dependencies: ${{ steps.check.outputs.fingerprint }})")
          fi

          if [ ${#reasons[@]} -gt 0 ]; then
            echo "needs_build=true" >> $GITHUB_OUTPUT
            echo "${{ steps.check.outputs.fingerprint }}" > last-build-fingerprint.txt
            echo "pkg_timestamp=$(date -u +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
            echo "Decision: BUILD TRIGGERED"
            echo "Trigger Reason(s):"
            for r in "${reasons[@]}"; do
              echo "  - $r"
            done
          else
            echo "needs_build=false" >> $GITHUB_OUTPUT
            echo "Decision: BUILD SKIPPED"
            echo "Reason: This exact combination of upstream tag and dependencies has already been built (cache hit, FORCE_BUILD=false)."
          fi

  build:
    needs: check-triggers
    if: needs.check-triggers.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, riscv64]
        
    steps:
      - name: Checkout Upstream Code
        uses: actions/checkout@v4
        with:
          repository: 'Thomas-Tsai/partclone'
          ref: ${{ needs.check-triggers.outputs.latest_tag }}
          path: 'partclone-src'
          fetch-depth: 0 

      - name: Checkout Packaging Files
        uses: actions/checkout@v4
        with:
          path: 'partclone-build'

      - name: Merge Packaging with Source
        run: |
          cp -a partclone-build/debian/ partclone-src/debian/

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.arch }}

      - name: Build Debian Package
        run: |
          docker run --rm \
            --platform linux/${{ matrix.arch }} \
            -v ${{ github.workspace }}/partclone-src:/src \
            -e DEBFULLNAME="GitHub Actions CI" \
            -e DEBEMAIL="actions@github.com" \
            -e DEB_BUILD_OPTIONS="noautodbgsym" \
            -e UPSTREAM_TAG="${{ needs.check-triggers.outputs.latest_tag }}" \
            -e PKG_TIMESTAMP="${{ needs.check-triggers.outputs.pkg_timestamp }}" \
            -e BUILD_STATIC="${{ needs.check-triggers.outputs.build_static }}" \
            -e ARCH="${{ matrix.arch }}" \
            debian:sid /bin/bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              export EDITOR=/bin/true  # Prevent gbp dch from crashing due to missing editor
              
              # Completely forbid APT from installing systemd v260+ to prevent QEMU crashes
              printf \"Package: systemd systemd-sysv libsystemd0 udev libudev1\nPin: version 260*\nPin-Priority: -1\n\" > /etc/apt/preferences.d/prevent-systemd-260
              
              apt-get update
              apt-get dist-upgrade -y || true
              apt-get autoremove -y
              
              # Install base packaging tools
              apt-get install -y --no-install-recommends devscripts equivs build-essential dh-python git-buildpackage git tar libdistro-info-perl
              apt-get install -y libjitterentropy3-dev || apt-get install -y libjitterentropy-dev || true
              
              mkdir -p /build
              cp -a /src/. /build/
              cd /build
              
              git config --global --add safe.directory /build
              git config --global user.name \"\$DEBFULLNAME\"
              git config --global user.email \"\$DEBEMAIL\"
              
              # Create a branch from the detached HEAD tag to safely modify the source
              git checkout -b auto-build-branch
              
              echo '=== Injecting Upstream Version Tag ==='
              CLEAN_VER=\$(echo \$UPSTREAM_TAG | sed 's/^v//')
              git archive --format=tar HEAD | tar xf -
              
              # Commit the modified tracked files so dpkg-source does not abort the build
              git add src/version.h toolbox 2>/dev/null || true
              git commit -m \"Inject version tag into source tree\" || true
              
              # Resolve debian/control and install actual build dependencies
              apt-get build-dep -y .
              
              echo '=== Auto-Versioning ==='
              # Tell gbp to build the exact version string using the unified timestamp from check-triggers
              gbp dch --ignore-branch \
                      --new-version=\"\${CLEAN_VER}-drblsid~\${PKG_TIMESTAMP}\" \
                      --distribution=\"unstable\" \
                      --release \
                      --spawn-editor=never \
                      --auto
              
              UPSTREAM_VER=\$(dpkg-parsechangelog -S Version | sed 's/-.*//' | sed 's/~.*//')
              
              mkdir -p /src/output-debs
              
              # Only amd64 builds the source package to prevent conflicting orig tarballs and race conditions
              if [ \"\$ARCH\" = \"amd64\" ]; then
                echo '=== Building Source and Dynamic Binary (amd64) ==='
                tar --exclude=.git --exclude=debian -czf ../partclone_\${UPSTREAM_VER}.orig.tar.gz .
                dpkg-buildpackage -us -uc --source-option=--auto-commit
                
                # 1. Safely store the dynamic .deb so it isn't overwritten
                mv ../*.deb /src/output-debs/
                
                # Copy source package artifacts
                cp ../*.orig.tar.gz /src/output-debs/ || true
                cp ../*.dsc /src/output-debs/ || true
                cp ../*.debian.tar.xz /src/output-debs/ || true
                
                if [ \"\$BUILD_STATIC\" = \"true\" ]; then
                  echo '=== CLEANING DIRTY BUILD TREE ==='
                  # 2. Manually wipe the compiled dynamic objects!
                  make clean || true
                  find . -name \"*.o\" -type f -delete
                  find . -name \"*.lo\" -type f -delete

                  echo '=== Building Statically Linked Package (amd64) ==='
                  # 3. Build the static version from scratch
                  if ls /usr/lib/*/libjitterentropy.a >/dev/null 2>&1 || [ -f /usr/lib/libjitterentropy.a ]; then
                    sed -i 's/STATIC_OPT = --enable-static-linking/STATIC_OPT = --enable-static-linking LIBS=-ljitterentropy/' debian/rules
                  fi
                  PARTCLONE_STATIC=1 dpkg-buildpackage -b -us -uc

                  # 4. Store the static .deb
                  mv ../*.deb /src/output-debs/
                else
                  echo '=== Skipping Statically Linked Package (BUILD_STATIC is not true) ==='
                fi
              else
                echo \"=== Building Dynamic Binary Only (\$ARCH) ===\"
                dpkg-buildpackage -b -us -uc

                # 1. Safely store the dynamic .deb so it isn't overwritten
                mv ../*.deb /src/output-debs/

                if [ \"\$BUILD_STATIC\" = \"true\" ]; then
                  echo '=== CLEANING DIRTY BUILD TREE ==='
                  # 2. Manually wipe the compiled dynamic objects!
                  make clean || true
                  find . -name \"*.o\" -type f -delete
                  find . -name \"*.lo\" -type f -delete

                  echo \"=== Building Statically Linked Package (\$ARCH) ===\"
                  # 3. Build the static version from scratch
                  if ls /usr/lib/*/libjitterentropy.a >/dev/null 2>&1 || [ -f /usr/lib/libjitterentropy.a ]; then
                    sed -i 's/STATIC_OPT = --enable-static-linking/STATIC_OPT = --enable-static-linking LIBS=-ljitterentropy/' debian/rules
                  fi
                  PARTCLONE_STATIC=1 dpkg-buildpackage -b -us -uc

                  # 4. Store the static .deb
                  mv ../*.deb /src/output-debs/
                else
                  echo \"=== Skipping Statically Linked Package for \$ARCH (BUILD_STATIC is not true) ===\"
                fi
              fi
              
              cp ../*.changes /src/output-debs/ || true
              
              chmod -R 777 /src/output-debs/
            "

      - name: Generate Timestamp
        id: time
        env:
          TZ: Asia/Taipei
        run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload .deb to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: partclone-sid-packages-${{ matrix.arch }}-${{ steps.time.outputs.timestamp }}
          path: partclone-src/output-debs/

      - name: Deploy to file Server
        env:
          SSH_KEY: ${{ secrets.REMOTE_SSH_KEY }}
          HOST: ${{ secrets.REMOTE_HOST }}
          USER: ${{ secrets.REMOTE_USER }}
          DEST: ${{ secrets.REMOTE_PATH }}
        if: env.SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          rsync -avz -e "ssh -i ~/.ssh/id_rsa" partclone-src/output-debs/ $USER@$HOST:$DEST

      - name: Send Telegram Notification (Success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ SUCCESS: Partclone Debian Sid (${{ matrix.arch }}) Auto-Build
            
            📦 Project: ${{ github.repository }}
            ⏱️ Timestamp: ${{ steps.time.outputs.timestamp }}
            🔗 Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send Telegram Notification (Failure)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ FAILED: Partclone Debian Sid (${{ matrix.arch }}) Auto-Build
            
            The build crashed! Please check the logs to see if a dependency is broken.
            📦 Project: ${{ github.repository }}
            🔗 Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}